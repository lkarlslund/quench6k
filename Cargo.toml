[workspace]
resolver = "3"
members = ["crates/cuda", "crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
quench6k-cuda = { path = "crates/cuda" }
quench6k-engine = { path = "crates/engine" }

[profile.release]
debug = "line-tables-only"
