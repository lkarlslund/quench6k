<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>quench6k · Models</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8956'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='%23111316' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg: #111315; --surface: #1a1d20; --border: #2d3136; --muted: #929ba6; --text: #edf0f4; --accent: #ff8956; --green: #65d5ab; --red: #ff8e8e;
      font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
    header { height: 76px; padding: 0 max(32px,calc((100vw - 1376px)/2)); display: flex; align-items: center; border-bottom: 1px solid var(--border); background: #151719; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 22px; font-weight: 750; letter-spacing: -1px; }
    .brand b { color: var(--accent); font-weight: inherit; }
    .mark { display: flex; flex-direction: column; gap: 4px; width: 29px; }
    .mark i { display: block; height: 3px; background: var(--accent); border-radius: 1px; width: 25px; }
    .mark i:nth-child(2) { width: 18px; } .mark i:nth-child(3) { width: 11px; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 32px; }
    .eyebrow { font-size: 10px; letter-spacing: 1.7px; color: #747e89; margin: 0 0 8px; }
    h1 { font-size: 34px; letter-spacing: -1px; margin: 0 0 8px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 28px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 22px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    select { flex: 1; min-width: 0; background: #22272c; color: var(--text); border: 1px solid #394048; border-radius: 4px; padding: 9px 10px; font: inherit; }
    button { background: var(--accent); color: #111316; border: 0; border-radius: 4px; padding: 9px 18px; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .status { margin-top: 16px; min-height: 20px; font-size: 13px; color: var(--muted); display: flex; gap: 9px; align-items: center; }
    .status.loading { color: #79adff; } .status.error { color: var(--red); }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .status.loading i { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    @media (max-width: 760px) { header { height: 65px; padding: 0 20px; } main { padding: 32px 16px; } h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <header><span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>quench<b>6k</b></span></span></header>
  <main>
    <p class="eyebrow">SERVE-MODELS</p>
    <h1>No model loaded<span>.</span></h1>
    <p>Requests that name a model load it on demand. Pick one to load it now; the engine dashboard opens when it is ready.</p>
    <div class="card">
      <label for="model">Model</label>
      <div class="row">
        <select id="model"></select>
        <button id="load" type="button">Load</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script>
    'use strict';
    const select = document.getElementById('model');
    const button = document.getElementById('load');
    const status = document.getElementById('status');
    let timer = null;
    function show(text, kind) {
      status.className = 'status' + (kind ? ' ' + kind : '');
      status.replaceChildren();
      if (!text) return;
      status.append(document.createElement('i'), document.createTextNode(text));
    }
    async function refresh() {
      clearTimeout(timer);
      let health;
      try {
        health = await (await fetch('/health', { cache: 'no-store' })).json();
      } catch (e) {
        show('The server does not answer; retrying…', 'error');
        timer = setTimeout(refresh, 2000);
        return;
      }
      if (select.options.length === 0) {
        for (const name of health.models || []) select.add(new Option(name, name));
      }
      if (health.state === 'loaded') { location.reload(); return; }
      const loading = health.state === 'loading';
      if (health.model && (loading || health.state === 'failed')) select.value = health.model;
      select.disabled = button.disabled = loading;
      if (loading) show('Loading ' + health.model + '…', 'loading');
      else if (health.state === 'failed') show(health.error || 'Loading failed', 'error');
      else if (!status.classList.contains('error')) show('');
      timer = setTimeout(refresh, loading ? 1000 : 5000);
    }
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const response = await fetch('/v1/load', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: select.value }) });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          show(body.error?.message || 'Loading failed (HTTP ' + response.status + ')', 'error');
          button.disabled = false;
          return;
        }
      } catch (e) {
        show('The server does not answer', 'error');
        button.disabled = false;
        return;
      }
      refresh();
    });
    refresh();
  </script>
</body>
</html>
